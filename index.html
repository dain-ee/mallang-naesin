<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="말랑 내신">
<title>말랑 내신</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css?v=1791122113">
</head>
<body>

<!-- 첫 로딩 인사 — 말랑 앱들과 같은 유령 -->
<div id="splash" class="splash"><span class="splash-ghost"></span></div>

<div class="shell">

  <!-- ───────── 사이드바 ───────── -->
  <aside class="sidebar">
    <div class="switch">
      <button class="brand" id="brand" type="button" aria-haspopup="listbox" aria-expanded="false">
        <span class="mark"></span>
        <span class="brand-text">
          <span class="brand-name">말랑 내신</span>
          <span class="brand-sub" id="lesson-sub">중2 동아(윤정미)</span>
        </span>
        <span class="brand-chev" aria-hidden="true"></span>
      </button>
      <div class="menu" id="lesson-menu" role="listbox" hidden></div>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item" data-tab="hw"      type="button" id="nav-hw" hidden><i class="ni">✎</i>숙제<span id="hw-tally" class="tally" hidden>0</span></button>
      <button class="nav-item is-on" data-tab="home"    type="button"><i class="ni">⌂</i>단원 홈</button>
      <button class="nav-item" data-tab="words"   type="button"><i class="ni">1</i>단어</button>
      <button class="nav-item" data-tab="comm"    type="button"><i class="ni">2</i>의사소통</button>
      <button class="nav-item" data-tab="grammar" type="button"><i class="ni">3</i>문법</button>
      <button class="nav-item" data-tab="reading" type="button"><i class="ni">4</i>본문</button>
      <button class="nav-item" data-tab="quiz"    type="button"><i class="ni">5</i>실전 문제</button>
      <button class="nav-item" data-tab="wrong"   type="button"><i class="ni">✕</i>오답노트<span id="wrong-tally" class="tally" hidden>0</span></button>
      <button class="nav-item" data-tab="log"     type="button"><i class="ni">✓</i>기록</button>
    </nav>

    <div class="side-foot">
      <div class="sync-state" id="sync-state" data-state="off"></div>
      <div class="who-line"><span class="who-dot"></span><span id="who-name">윤건</span><button id="who-edit" class="link" type="button">바꾸기</button></div>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div id="toast" class="toast" hidden></div>

<div id="boot-msg" class="boot-msg">불러오는 중…</div>
<script src="config.js?v=1791122113"></script>
<script src="loader.js?v=1791122113"></script>
</body>
</html>
