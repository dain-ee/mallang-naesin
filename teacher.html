<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="말랑 쪽지">
<title>말랑 내신 · 학생 쪽지</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<style>
  body { min-height: 100vh; }
  .tc { display: grid; grid-template-columns: 300px 1fr; height: 100vh; height: 100dvh; max-width: 1200px; margin: 0 auto; gap: 0; }
  .tc-side { display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--card); min-height: 0; }
  .tc-top { padding: 20px 18px 12px; }
  .tc-top h1 { margin: 0; font-size: 20px; font-weight: 800; }
  .tc-top p { margin: 4px 0 0; font-size: 13px; color: var(--sub); }
  .tc-tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .tc-chip { font: inherit; font-size: 12.5px; font-weight: 700; color: var(--mid); background: var(--line-soft); border: 0; border-radius: 99px; padding: 6px 11px; cursor: pointer; }
  .tc-chip.on { color: var(--accent); background: var(--accent-soft); }
  .tc-stus { flex: 1; overflow-y: auto; padding: 4px 10px 16px; }
  .tc-stu { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 10px; font: inherit; text-align: left; color: var(--ink); background: none; border: 0; border-radius: 14px; cursor: pointer; }
  .tc-stu:hover { background: var(--line-soft); }
  .tc-stu.on { background: var(--accent-soft); }
  .tc-av { flex: none; width: 42px; height: 42px; display: grid; place-items: center; font-size: 16px; font-weight: 800; color: var(--accent); background: var(--accent-soft); border-radius: 14px; }
  .tc-stu.on .tc-av { color: #fff; background: var(--accent); }
  .tc-meta { flex: 1; min-width: 0; }
  .tc-name { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; font-weight: 800; }
  .tc-name small { font-size: 11.5px; font-weight: 600; color: var(--sub); white-space: nowrap; }
  .tc-last { margin-top: 2px; font-size: 13px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tc-un { flex: none; min-width: 22px; height: 22px; padding: 0 6px; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #fff; background: #f04452; border-radius: 99px; font-variant-numeric: tabular-nums; }
  .tc-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
  .tc-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--card); }
  .tc-head b { font-size: 17px; font-weight: 800; }
  .tc-head span { font-size: 13px; color: var(--sub); }
  .tc-back { display: none; font: inherit; font-size: 18px; width: 36px; height: 36px; color: var(--mid); background: var(--line-soft); border: 0; border-radius: 99px; cursor: pointer; }
  .tc-main .nc-list { flex: 1; padding: 14px 22px 8px; }
  .tc-main .nc-line { max-width: 70%; }
  .tc-main .nc-form { padding: 12px 18px; }
  .tc-none { margin: auto; text-align: center; color: var(--sub); font-size: 15px; line-height: 1.7; padding: 24px; }
  .tc-gate { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; background: var(--bg); z-index: 10; }
  .tc-gate form { width: min(360px, 100%); text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 28px 24px; }
  .tc-gate h1 { margin: 0 0 6px; font-size: 20px; }
  .tc-gate p { margin: 0 0 16px; font-size: 14px; color: var(--mid); }
  .tc-gate input { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; text-align: center; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 12px; outline: none; }
  .tc-gate input:focus { border-color: var(--accent); }
  .tc-gate button { margin-top: 12px; width: 100%; font: inherit; font-size: 16px; font-weight: 800; padding: 12px; color: #fff; background: var(--accent); border: 0; border-radius: 12px; cursor: pointer; }
  .tc-err { min-height: 20px; margin-top: 10px; font-size: 13.5px; color: var(--err); }
  .tc-state { font-size: 12px; color: var(--sub); padding: 0 18px 10px; }
  @media (max-width: 760px) {
    .tc { grid-template-columns: 1fr; }
    .tc.thread .tc-side { display: none; }
    .tc:not(.thread) .tc-main { display: none; }
    .tc-back { display: block; }
    .tc-main .nc-line { max-width: 84%; }
    .tc-main .nc-list { padding: 12px 14px 6px; }
  }
</style>
</head>
<body>
<div class="tc" id="tc">
  <aside class="tc-side">
    <div class="tc-top">
      <h1>학생 쪽지</h1>
      <p>학생이 앱에서 「선생님께 말하기」로 보낸 말이에요</p>
      <div class="tc-tools"><button type="button" class="tc-chip" id="tc-noti">알림 켜기</button><button type="button" class="tc-chip" id="tc-out">이 기기에서 키 지우기</button></div>
    </div>
    <div class="tc-stus" id="tc-stus"></div>
    <div class="tc-state" id="tc-state"></div>
  </aside>
  <main class="tc-main" id="tc-main"><div class="tc-none">왼쪽에서 학생을 골라 주세요</div></main>
</div>

<script src="config.js"></script>
<script src="chat.js"></script>
<script>
(function () {
  const C = window.NaesinChat, KK = 'mallang-naesin:teacher-chat', $ = (s) => document.querySelector(s), esc = C.esc;
  let KEYV = ''; try { KEYV = localStorage.getItem(KK) || ''; } catch (e) {}
  let inbox = [], cur = null, msgs = [], lastId = 0, seenUpto = 0, busy = false, known = null;
  const total = () => inbox.reduce((n, x) => n + (x.unread || 0), 0);
  const ago = (at) => { if (!at) return ''; const d = new Date(at), n = new Date(); return d.toDateString() === n.toDateString() ? C.hm(at) : `${d.getMonth() + 1}/${d.getDate()}`; };

  function gate(err) {
    let g = $('.tc-gate');
    if (!g) {
      g = document.createElement('div'); g.className = 'tc-gate';
      g.innerHTML = `<form><h1>선생님 키를 넣어 주세요</h1><p>한 번 넣으면 이 기기에 기억해요</p><input type="password" autocomplete="current-password" aria-label="선생님 키"><button>열기</button><div class="tc-err"></div></form>`;
      document.body.appendChild(g);
      g.querySelector('form').onsubmit = async (e) => {
        e.preventDefault(); const v = g.querySelector('input').value.trim(); if (!v) return;
        try { await C.rpc('naesin_msg_inbox', { p_key: v }); KEYV = v; try { localStorage.setItem(KK, v); } catch (er) {} g.remove(); start(); }
        catch (er) { g.querySelector('.tc-err').textContent = er.status ? '키가 맞지 않아요. 다시 확인해 주세요.' : '인터넷 연결을 확인해 주세요.'; }
      };
    }
    if (err) g.querySelector('.tc-err').textContent = err;
    setTimeout(() => g.querySelector('input').focus(), 30);
  }

  function title() { const n = total(); document.title = (n ? `(${n}) ` : '') + '말랑 내신 · 학생 쪽지'; }
  function drawSide() {
    $('#tc-stus').innerHTML = inbox.map((x) => `<button type="button" class="tc-stu ${cur === x.student ? 'on' : ''}" data-s="${esc(x.student)}">
      <span class="tc-av">${esc(x.student.slice(0, 1))}</span><span class="tc-meta"><span class="tc-name">${esc(x.student)}<small>${ago(x.last_at)}</small></span>
      <span class="tc-last">${x.last_body ? (x.last_sender === 'teacher' ? '나: ' : '') + esc(x.last_body) : '아직 대화가 없어요'}</span></span>${x.unread ? `<span class="tc-un">${x.unread > 99 ? '99+' : x.unread}</span>` : ''}</button>`).join('');
    $('#tc-stus').querySelectorAll('.tc-stu').forEach((b) => (b.onclick = () => openStu(b.dataset.s)));
    title();
  }

  function notify(fresh) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    fresh.forEach((x) => { try { const n = new Notification(`${x.student}: 새 메시지`, { body: x.last_body || '', tag: 'naesin-' + x.student, icon: 'favicon.svg' }); n.onclick = () => { window.focus(); openStu(x.student); n.close(); }; } catch (e) {} });
  }

  async function pollInbox() {
    try {
      const r = await C.rpc('naesin_msg_inbox', { p_key: KEYV });
      const prev = known; known = {}; r.forEach((x) => (known[x.student] = x.max_id || 0));
      if (prev) notify(r.filter((x) => x.last_sender === 'student' && (x.max_id || 0) > (prev[x.student] || 0) && !(x.student === cur && !document.hidden)));
      inbox = r; if (cur) { const me = inbox.find((x) => x.student === cur); if (me && !document.hidden) me.unread = 0; }
      drawSide(); $('#tc-state').textContent = '5초마다 새 메시지를 확인해요 · ' + C.hm(new Date());
    } catch (e) { if (e.status) { try { localStorage.removeItem(KK); } catch (er) {} gate('키가 바뀌었어요. 다시 넣어 주세요.'); throw e; } $('#tc-state').textContent = '연결이 끊겼어요. 다시 시도하는 중이에요'; }
  }

  async function pollThread(first) {
    if (!cur || busy) return; busy = true; const s = cur;
    try {
      const r = await C.rpc('naesin_msg_thread', { p_key: KEYV, p_student: s, p_after: lastId });
      if (s !== cur) return;
      const fresh = (r.msgs || []).filter((m) => !msgs.some((x) => x.id === m.id));
      const ch = fresh.length || r.seen_upto !== seenUpto;
      if (fresh.length) { msgs = msgs.filter((x) => !x.pending).concat(fresh).sort((a, b) => a.id - b.id); lastId = Math.max(lastId, ...fresh.map((m) => m.id)); }
      seenUpto = r.seen_upto || 0;
      if (!document.hidden && (fresh.some((m) => m.sender === 'student' && !m.read) || first)) await C.rpc('naesin_msg_read', { p_key: KEYV, p_student: s });
      if (ch || first) C.renderMsgs($('#tc-list'), msgs, 'teacher', seenUpto, s);
    } catch (e) {} finally { busy = false; }
  }

  let pic = null;
  function openStu(s) {
    cur = s; msgs = []; lastId = 0; seenUpto = 0; pic = null; $('#tc').classList.add('thread');
    const x = inbox.find((y) => y.student === s); if (x) x.unread = 0; drawSide();
    $('#tc-main').innerHTML = `<div class="tc-head"><button type="button" class="tc-back" aria-label="목록으로">‹</button><div><b>${esc(s)}</b> <span>학생</span></div></div>
      <div class="nc-list" id="tc-list" data-empty="${esc(s)}에게 먼저 말을 걸어 보세요" data-stick="1"></div>
      <div class="nc-pic" hidden><img alt="보낼 사진"><button type="button" class="nc-pic-x">사진 빼기</button></div>
      <form class="nc-form"><label class="nc-attach" title="사진 보내기"><input type="file" accept="image/*" hidden><span aria-hidden="true">＋</span></label>
      <textarea rows="1" placeholder="답장을 입력하세요" aria-label="답장"></textarea><button type="submit" class="nc-send" disabled>보내기</button></form>`;
    $('#tc-list').innerHTML = '<div class="nc-empty">불러오는 중이에요</div>';
    $('.tc-back').onclick = () => { $('#tc').classList.remove('thread'); cur = null; drawSide(); };
    const ta = $('#tc-main textarea'), btn = $('#tc-main .nc-send'), pb = $('#tc-main .nc-pic'), fi = $('#tc-main input[type=file]');
    const can = () => { btn.disabled = !(ta.value.trim() || pic); }; ta.addEventListener('input', can);
    const setPic = (d) => { pic = d; pb.hidden = !d; if (d) pb.querySelector('img').src = d; can(); };
    fi.onchange = async () => { const f = fi.files[0]; fi.value = ''; if (f) try { setPic(await C.shrink(f)); } catch (e) { alert('이 사진은 보낼 수 없어요'); } };
    pb.querySelector('.nc-pic-x').onclick = () => setPic(null);
    ta.addEventListener('paste', async (e) => { const it = [...((e.clipboardData || {}).items || [])].find((v) => v.type.startsWith('image/')); if (it) { e.preventDefault(); try { setPic(await C.shrink(it.getAsFile())); } catch (er) {} } });
    const fit = C.wireInput(ta, () => send());
    $('#tc-main .nc-form').onsubmit = (e) => { e.preventDefault(); send(); };
    async function send() {
      const body = ta.value.trim(), img = pic; if (!body && !img) return;
      const tmp = { id: 1e15 + Date.now(), sender: 'teacher', body, img, at: new Date().toISOString(), pending: true };
      msgs.push(tmp); ta.value = ''; fit(); setPic(null); $('#tc-list').dataset.stick = '1'; C.renderMsgs($('#tc-list'), msgs, 'teacher', seenUpto, s);
      try { const m = await C.rpc('naesin_msg_reply', { p_key: KEYV, p_student: s, p_body: body, p_img: img }); msgs = msgs.filter((x) => x !== tmp); if (!msgs.some((x) => x.id === m.id)) msgs.push(m); msgs.sort((a, b) => a.id - b.id); }
      catch (e) { msgs = msgs.filter((x) => x !== tmp); ta.value = body; fit(); setPic(img); alert('못 보냈어요. 인터넷을 확인하고 다시 보내 주세요.'); }
      $('#tc-list').dataset.stick = '1'; C.renderMsgs($('#tc-list'), msgs, 'teacher', seenUpto, s); pollInbox();
    }
    pollThread(true); setTimeout(() => ta.focus(), 30);
  }

  const notiBtn = $('#tc-noti');
  function notiState() {
    if (!('Notification' in window)) { notiBtn.hidden = true; return; }
    const p = Notification.permission; notiBtn.textContent = p === 'granted' ? '알림 켜짐' : p === 'denied' ? '알림 막힘 (브라우저 설정)' : '알림 켜기'; notiBtn.classList.toggle('on', p === 'granted');
  }
  notiBtn.onclick = async () => { if (Notification.permission === 'default') await Notification.requestPermission(); notiState(); };
  $('#tc-out').onclick = () => { if (!confirm('이 기기에 저장한 선생님 키를 지울까요?')) return; try { localStorage.removeItem(KK); } catch (e) {} location.reload(); };

  let loop = null;
  async function start() {
    notiState();
    try { await pollInbox(); } catch (e) { return; }
    const q = new URLSearchParams(location.search).get('s'); if (q && inbox.some((x) => x.student === q)) openStu(q);
    clearInterval(loop); loop = setInterval(() => { pollInbox().catch(() => {}); pollThread(); }, 5000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { pollInbox().catch(() => {}); if (cur) pollThread(true); } });
  }
  if (KEYV) start(); else gate();
})();
</script>
</body>
</html>
